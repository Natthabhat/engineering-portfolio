name: namon-portfolio
services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: namon-portfolio:local
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORTFOLIO_PORT:-8080}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
